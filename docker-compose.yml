services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3011:3000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_URL: http://api:3000
    ports:
      - "3006:3000"
    depends_on:
      - api
